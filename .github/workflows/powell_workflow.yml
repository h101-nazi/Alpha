name: Powell Fakeout Scanner (5m)

on:
  schedule:
    # Runs every 5 minutes from 10:10 AM to 11:30 AM EST (15:10 to 16:30 UTC)
    - cron: '10,15,20,25,30,35,40,45,50,55 15 * * 1-5'
    - cron: '0,5,10,15,20,25,30 16 * * 1-5'
  workflow_dispatch: 

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install yfinance pandas numpy requests pytz
        
      - name: Run Scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python powell_scanner.py
        
      - name: Save State and Journal
        run: |
          git config --global user.name 'Syndicate Bot'
          git config --global user.email 'bot@syndicate.com'
          
          # Pull the latest changes just in case another bot ran
          git pull origin main
          
          # THE FIX: Add all changed files. If the journal doesn't exist yet, it won't crash.
          git add -A
          
          # Commit and push only if there are actual changes
          git diff-index --quiet HEAD || git commit -m "Auto-update: Powell 5m Journal & State"
          git push origin main
