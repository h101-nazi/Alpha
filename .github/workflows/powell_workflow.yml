name: Powell Fakeout Scanner (5m)

on:
  schedule:
    # Runs every 5 minutes between 10:10 AM and 11:30 AM EST
    - cron: '10,15,20,25,30,35,40,45,50,55 14 * * 1-5'
    - cron: '0,5,10,15,20,25,30 15 * * 1-5'
  workflow_dispatch: 

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install yfinance pandas numpy requests pytz
        
      - name: Run Scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python powell_scanner.py
        
      - name: Save State and Journal
        run: |
          git config --global user.name 'Syndicate Bot'
          git config --global user.email 'bot@syndicate.com'
          git pull origin main
          git add powell_trade_journal.csv powell_last_alert.json
          git diff-index --quiet HEAD || git commit -m "Auto-update: Powell 5m Journal & State"
          git push
