name: Powell Fakeout Scanner

on:
  schedule:
    # Runs every 5 minutes between 3:00 PM and 5:00 PM UTC (10 AM - 12 PM EST)
    - cron: '*/5 15-17 * * 1-5'
  workflow_dispatch: # Allows manual testing

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install yfinance pandas numpy requests pytz
        
      - name: Run Scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python powell_scanner.py
        
      - name: Save State and Journal
        run: |
          git config --global user.name 'Syndicate Bot'
          git config --global user.email 'bot@syndicate.com'
          git add last_alert.json
          git add powell_trade_journal.csv
          git commit -m "Auto-update: Trade Journal & State" || echo "No changes to commit"
          git push
