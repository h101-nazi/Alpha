name: Powell Fakeout Scanner

on:
  schedule:
    - cron: '*/5 15-17 * * 1-5' # Every 5 mins from 10 AM to 12 PM EST
  workflow_dispatch: 

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial for pushing changes back to the repo
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install yfinance pandas numpy requests pytz
        
      - name: Run Scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python powell_scanner.py
        
      - name: Save State and Journal
        run: |
          git config --global user.name 'Syndicate Bot'
          git config --global user.email 'bot@syndicate.com'
          
          # Pull the latest changes just in case another run committed something
          git pull origin main
          
          # Add all changed files safely (ignores files that don't exist yet)
          git add -A
          
          # Commit and push only if there are actual changes
          git diff-index --quiet HEAD || git commit -m "Auto-update: Trade Journal & State"
          git push origin main
