name: Powell Fakeout Scanner (1H)

on:
  schedule:
    # Runs at 12:01 PM EST (17:01 UTC) and 1:01 PM EST (18:01 UTC) Mon-Fri
    # This catches the close of the 11:00 AM and 12:00 PM candles.
    - cron: '1 17,18 * * 1-5'
  workflow_dispatch: # Allows manual testing

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install yfinance pandas numpy requests pytz
        
      - name: Run Scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python powell_scanner.py
        
      - name: Save State and Journal
        run: |
          git config --global user.name 'Syndicate Bot'
          git config --global user.email 'bot@syndicate.com'
          
          # Pull the latest changes
          git pull origin main
          
          # Add all changed files
          git add -A
          
          # Commit and push only if there are actual changes
          git diff-index --quiet HEAD || git commit -m "Auto-update: 1H Trade Journal & State"
          git push origin main
