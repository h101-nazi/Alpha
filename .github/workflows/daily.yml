name: Syndicate GEX Logger

on:
  schedule:
    # Runs at 4:15 PM EST (21:15 UTC) Monday-Friday
    - cron: '15 21 * * 1-5'
  workflow_dispatch: 

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install lse-data pandas numpy requests pytz
        
      - name: Run GEX Logger
        env:
          LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python syndicate_logger.py
        
      - name: Commit and Push new data
        run: |
          git config --global user.name 'Syndicate Bot'
          git config --global user.email 'bot@syndicate.com'
          
          # Pull the latest changes
          git pull origin main
          
          # THE FIX: Add all changed files. If the CSV doesn't exist, it won't crash.
          git add -A
          
          # Commit and push only if there are actual changes
          git diff-index --quiet HEAD || git commit -m "Auto-update: GEX Journal"
          git push origin main
