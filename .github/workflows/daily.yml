name: Daily GEX Update
on:
  schedule:
    - cron: '15 21 * * 1-5'
  workflow_dispatch:
jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install
        run: pip install yfinance pandas numpy scipy
      - name: Run
        run: python syndicate_logger.py
      - name: Commit
        run: |
          git config --global user.name 'Bot'
          git config --global user.email 'bot@bot.com'
          git add syndicate_gex_history.csv
          git commit -m "update data" || echo "no changes"
          git push
